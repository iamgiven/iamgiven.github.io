<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Given Software</title>
<meta name="description" content="Apps by Given Software.">
<style>
  :root { --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1e; --muted: #5f6068; --line: #e3e3e7; --link: #3b5bdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0f13; --card: #17181d; --text: #ececf0; --muted: #9a9ba5; --line: #2a2b32; --link: #8ea2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 40px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .app h3 { margin: 0 0 4px; font-size: 18px; }
  .app p { margin: 0 0 14px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Given Software</h1>
  <p class="lead">Small Android apps.</p>

  <h2>Apps</h2>
  <section class="app">
    <h3>Animatry: Live Wallpaper</h3>
    <p>Mathematical animations as a live wallpaper.</p>
    <div class="links">
      <a href="/animatry-legal/privacy-policy">Privacy Policy</a>
      <a href="/animatry-legal/terms-of-service">Terms of Service</a>
    </div>
  </section>

  <footer>Contact: <a href="mailto:iamgiven.dev@gmail.com">iamgiven.dev@gmail.com</a></footer>
</main>
</body>
</html>
